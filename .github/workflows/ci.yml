name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay
      RELAY_REQUIRE_DB: "1"
      RELAY_CHAOS_RUNS: "100"  # WP4b acceptance: 100/100 exactly once (issue #5)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - name: Install
        run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check relay tests && uv run ruff format --check relay tests
      - name: Types (mypy strict)
        run: uv run mypy relay
      - name: Architecture contracts (import-linter)
        run: uv run lint-imports
      - name: Migrations apply
        run: uv run relay db upgrade
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # PRD 5.2: extension PRs (label `extension`, or a branch with "exit" in its name) must not touch relay/core/
  core-frozen:
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'extension') || contains(github.head_ref, 'exit'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Assert zero diff under relay/core/
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- relay/core/)
          if [ -n "$CHANGED" ]; then echo "core changed:"; echo "$CHANGED"; exit 1; fi
          echo "relay/core/ untouched"
