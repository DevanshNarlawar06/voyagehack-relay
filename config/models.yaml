# PRD 13.3. Provider change = edit this file only.
providers:
  mock:    { litellm_model: "mock/deterministic", price_inr: { in_per_1k: 0.01, out_per_1k: 0.03 }, region: local }
  # Gemini (needs GEMINI_API_KEY). Older ids (2.5) are closed to new keys and Pro is outside the
  # free quota, so both tiers use Flash models. Prices are ESTIMATES, not verified list prices;
  # a free-tier key is billed nothing. Check Google's pricing page before quoting costs.
  gemini_flash_lite: { litellm_model: "gemini/gemini-3.1-flash-lite", price_inr: { in_per_1k: 0.009, out_per_1k: 0.035 }, region: google }
  gemini_flash:      { litellm_model: "gemini/gemini-3.5-flash", price_inr: { in_per_1k: 0.027, out_per_1k: 0.22 }, region: google }
tiers:
  # Offline by default, so tests and CI never call a model. RELAY_MODEL_TIER1 / RELAY_MODEL_TIER2
  # (in the environment or .env, read by the `relay` CLI) switch a tier to a provider above.
  tier1: mock
  tier2: mock
defaults: { max_output_tokens: 400, temperature: 0, json_mode: true }
thresholds: {}    # per skill, written from evals/threshold_report.md
