# DPDP retention sweeper (PRD 14). Built only through extension points: no relay/core change.
# Started by `relay retention-sweep` (event `retention.sweep.due`, optional `as_of` date), by hand
# or from a nightly cron: nothing schedules it yet.
# Finds documents past what retention.yaml allows and purges them: the encrypted file is deleted,
# extracted fields are cleared, and the audited step result names each purged document.
# When the rules can't tell (no employee record, no exit date, no verification date), a document
# is kept. Rejected candidates' documents are not swept yet (they have no employee record).
name: retention_sweeper
version: 1
subject: system
description: Purge documents whose DPDP retention has ended, auditing each purge
trigger: { event: retention.sweep.due }
context:
  as_of: "has(trigger.as_of) ? trigger.as_of : now"
steps:
  - id: find_expired
    kind: rule
    uses: rules.retention.find_expired
    action: documents.retention.check
    inputs: { as_of: "ctx.as_of" }
    outputs: { expired: "result" }

  - id: purge_documents
    kind: rule
    uses: rules.retention.purge
    action: documents.purge
    needs: [find_expired]
    when: "ctx.expired.count > 0"
    inputs: { document_ids: "ctx.expired.documents" }
    outputs: { purge: "result" }
