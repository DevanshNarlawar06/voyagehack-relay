skill: intake
version: 1
description: Turn a chat message into an intent and slots
principal: conversation.user
allowed_actions: [chat.intake]
prompt_version: v1
threshold: 0.67  # from evals/threshold_report.md; two of three samples must agree
max_output_tokens: 80
data_seen:
  - "The message text, as typed"
masking: "Regex and checksum recognizers. **A name typed into a message is not masked** (see Known gap)."
model_use: "Only when the keyword table does not match. Three samples must agree. POSH, grievance and whistleblower messages match the table first, so they never reach a model."
retention: "Masked payloads are kept in model_payloads with the audit log. The mapping back to real values is in memory for the call only."
output_schema:
  type: object
  properties:
    intent: { enum: [onboarding_status, documents_uploaded, policy_question, resign, data_request, posh_report, grievance_report, whistleblower_report, unknown] }
  required: [intent]
