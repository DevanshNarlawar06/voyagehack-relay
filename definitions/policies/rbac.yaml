pack: rbac
version: 1
owner: hr_admin
description: >
  Roles -> permitted action patterns, the action catalogue and DPDP purposes.
  Agents get principal permissions ∩ skill allowlist. Reserved and route-only floors apply on top,
  so a role listed here can still be sent to a human for a reserved action.
roles:
  system:   # the workflow engine, acting for the HR ops pool
    - "employee.*"
    - "hr.*"
    - "documents.*"
    - "directory.*"
    - "assets.*"
    - "access.*"
    - "payroll.*"
    - "statutory.*"
    - "comms.*"
    - "calendar.*"
    - "notify.*"
    - "ticketing.*"
    - "sla.*"
    - "exception.analyse"
    - "hiring.*"
    - "employment.*"
    - "grievance.route"
    - "posh.route"
    - "whistleblower.route"
    - "data_request.*"   # erasure is still reserved for hr_admin (reserved.yaml)
  hr_ops:
    - "runs.read"
    - "tasks.*"
    - "employee.*"
    - "documents.*"
    - "hr.*"
    - "chat.*"
    - "metrics.read"
    - "policy.read"
    - "kill_switch.read"
    - "connectors.read"
    - "events.ingest"
    - "data_request.correction.decide"
  hr_admin: ["*"]
  manager:
    - "runs.read.team"
    - "tasks.*"
    - "employee.buddy.override"
    - "employment.probation.confirm"
    - "employment.resignation.accept"
    - "employment.release_date.agree"
    - "employment.notice_buyout.agree"
    - "chat.*"
  approver_offer: ["hiring.*", "tasks.*"]
  approver_it_spend: ["assets.laptop.allocate", "assets.laptop.allocate.exception", "tasks.*"]
  approver_finance: ["comp.*", "payroll.*", "statutory.*", "tasks.*"]
  it_ops: ["tasks.*", "assets.*", "directory.*", "connectors.read"]
  admin_ops: ["tasks.*", "access.*"]
  finance_ops: ["tasks.*", "payroll.*"]
  new_joiner:
    - "documents.upload"
    - "consent.*"
    - "policies.acknowledge"
    - "onboarding.status.read"
    - "chat.*"
  employee:
    - "chat.*"
    - "employee.self.read"
    - "data_request.create"   # raise a request; never decide one
    - "consent.*"
    - "employment.resignation.submit"
    - "grievance.route"
    - "posh.route"
    - "whistleblower.route"
  auditor: ["audit.read", "audit.export", "runs.read", "metrics.read", "policy.read", "kill_switch.read", "connectors.read", "employee.read"]
  developer: ["definitions.*", "runs.read"]
  # hr_admin holds "*", which is how it gets policy.edit, policy.activate, kill_switch.set,
  # controls.fault and runs.cancel.

# Action catalogue (registry validation checks every workflow `action` is declared here).
actions:
  employee.create: { description: "Create pre-hire record" }
  hr.terms.compute: { description: "Compute joining terms from labour rules" }
  documents.request: { description: "Send upload link and consent notice" }
  documents.collect: { description: "Gather the joiner's uploaded documents", purpose: onboarding_verification }
  documents.extract: { description: "Extract fields from uploaded documents", purpose: onboarding_verification }
  employee.verify: { description: "Cross-check identity fields", purpose: onboarding_verification }
  employee.activate_code: { description: "Allocate employee code" }
  directory.account.create: { description: "Create email/directory account", purpose: it_provisioning }
  assets.laptop.select: { description: "Choose laptop spec from role/grade table" }
  assets.laptop.allocate: { description: "Allocate a laptop", purpose: it_provisioning }
  access.card.issue: { description: "Issue access card", purpose: it_provisioning }
  payroll.employee.setup: { description: "Set up payroll with approved CTC", purpose: payroll_setup }
  statutory.pf.register: { description: "Register PF/UAN", purpose: statutory_registration }
  employee.buddy.assign: { description: "Assign onboarding buddy" }
  comms.manager_brief: { description: "Draft manager/buddy welcome brief" }
  hr.policies.request: { description: "Ask the joiner to acknowledge required policies" }
  exception.analyse: { description: "Summarise a stopped step for the person who decides it" }
  comms.send: { description: "Send a templated or drafted message to an employee or manager" }
  calendar.events.create: { description: "Schedule day-one events" }
  employee.activate: { description: "Readiness gate, move to active" }
  employment.probation.schedule: { description: "Wait until probation ends" }
  employment.probation.confirm: { description: "Confirm/extend probation (reserved)" }
  hiring.offer.approve: { description: "Approve offer (baseline reserved)" }
  # Exit (PRD 5.2)
  employment.resignation.route: { description: "Find the leaver and the manager who accepts" }
  employment.resignation.accept: { description: "Accept a resignation, agree release date or buyout (baseline reserved)" }
  hr.exit_terms.compute: { description: "Compute last working day and F&F due date from labour rules" }
  comms.kt_plan: { description: "Draft the knowledge transfer plan" }
  access.revocation.schedule: { description: "Wait until the last working day to revoke access" }
  assets.laptop.lookup: { description: "Find the leaver's laptop" }
  assets.laptop.recover: { description: "Recover the leaver's laptop", purpose: employment_exit }
  access.card.lookup: { description: "Find the leaver's access card" }
  access.card.revoke: { description: "Revoke the leaver's access card", purpose: employment_exit }
  directory.account.lookup: { description: "Find the leaver's directory account" }
  directory.account.disable: { description: "Disable the leaver's directory account", purpose: employment_exit }
  payroll.employee.lookup: { description: "Find the leaver's payroll record" }
  payroll.exit.notify: { description: "Tell payroll the employee is exiting", purpose: employment_exit }
  payroll.fnf.compute: { description: "Compute F&F inputs (gratuity, notice shortfall); pays nothing", purpose: employment_exit }
  payroll.fnf.signoff: { description: "Sign off full and final settlement (baseline reserved)" }
  employment.relieving_letter.issue: { description: "Issue the templated relieving letter" }
  comms.exit_survey: { description: "Send the exit survey" }
  employee.exit: { description: "Close the record: employee exited" }
  # DPDP data requests (PRD 14)
  data_request.verify: { description: "Check a data request names a person and is open" }
  data_request.export.build: { description: "Build the person's own record for an access request (sealed)" }
  data_request.correction.decide: { description: "Approve or reject a correction to the person's record" }
  data_request.erasure.decide: { description: "Erase, or refuse because the law requires keeping the data (reserved)" }
  data_request.close: { description: "Record how a data request ended" }
  documents.retention.check: { description: "Find documents whose DPDP retention has ended" }
  documents.purge: { description: "Delete an expired document's file and extracted fields (audited)" }

purposes:   # documentation only; legitimate-use purposes skip the consent check
  onboarding_verification: Verify identity and eligibility documents of a new joiner
  payroll_setup: Pay salary into the employee's bank account
  statutory_registration: Register for PF/ESI as required by law
  it_provisioning: Provide accounts, devices and building access for work
  employment_exit: Recover assets, revoke access and settle dues when employment ends
legitimate_use_purposes:
  - statutory_registration   # DPDP Act 2023 s.7: compliance with law
  - it_provisioning          # DPDP Act 2023 s.7(i): for the purposes of employment
  - employment_exit          # DPDP Act 2023 s.7(i): for the purposes of employment
