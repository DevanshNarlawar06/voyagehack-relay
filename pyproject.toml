[project]
name = "relay"
version = "0.1.0"
description = "Relay: AI-native, governed HR services platform for TBO (VoyageHack 4.0, PS6 Darwinbox)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # WP1 fills this in (fastapi, sqlalchemy, alembic, pydantic, cel-python, typer, ...)

[project.scripts]
relay = "relay.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Architecture contracts (PRD 6, 21). Enforced in CI once WP1 adds import-linter.
[tool.importlinter]
root_package = "relay"

[[tool.importlinter.contracts]]
name = "core does not import concrete connectors, skills or interfaces"
type = "forbidden"
source_modules = ["relay.core"]
forbidden_modules = ["relay.connectors", "relay.skills", "relay.api", "relay.slack"]
