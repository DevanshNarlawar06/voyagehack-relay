[project]
name = "relay"
version = "0.1.0"
description = "Relay: AI-native, governed HR services platform for TBO (VoyageHack 4.0, PS6 Darwinbox)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "cryptography>=43",
    "typer>=0.12",
    "cel-python>=0.1.5",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-PyYAML",
    "types-jsonschema>=4.26.0.20261006",
]

[project.scripts]
relay = "relay.cli:app"

[project.optional-dependencies]
llm = [
    "litellm>=1.108.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["relay/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "E501"]  # SQLAlchemy class config dicts; line length is left to ruff format

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["litellm"]  # optional extra, not installed in CI
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import mocks/
markers = ["db: needs a Postgres database (DATABASE_URL)"]

# Architecture contracts (PRD 6, 21). Run: lint-imports
[tool.importlinter]
root_package = "relay"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not import concrete connectors, skills or interfaces"
type = "forbidden"
source_modules = ["relay.core"]
forbidden_modules = ["relay.connectors", "relay.skills", "relay.api", "relay.slack"]

[[tool.importlinter.contracts]]
name = "only relay.connectors may import httpx (PRD 6.4)"
type = "forbidden"
source_modules = ["relay.core", "relay.db", "relay.rules", "relay.skills", "relay.models", "relay.api", "relay.slack", "relay.worker", "relay.cli"]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
name = "only relay.models may import litellm (PRD 6.5)"
type = "forbidden"
source_modules = ["relay.core", "relay.db", "relay.rules", "relay.skills", "relay.connectors", "relay.api", "relay.slack", "relay.worker", "relay.cli"]
forbidden_modules = ["litellm"]
