# WP1 owns this file. Postgres is enough to start; api/worker/web/mocks/slack are added by their WPs.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["55432:5432"]   # 55432 on the host avoids clashing with a local Postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      retries: 10
  mocks:
    build: ./mocks
    ports: ["9000:9000"]
  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
      RELAY_MOCKS_URL: http://mocks:9000
      RELAY_NOTIFY_URL: http://mocks:9000
      RELAY_CONSOLE_ORIGIN: "${RELAY_CONSOLE_ORIGIN:-http://localhost:3000}"
      RELAY_ENCRYPTION_KEY: "${RELAY_ENCRYPTION_KEY:-}"
      RELAY_JWT_SECRET: "${RELAY_JWT_SECRET:-dev-only-secret}"
    ports: ["8000:8000"]
volumes:
  pgdata:
